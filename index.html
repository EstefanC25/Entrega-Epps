<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Entrega de EPP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hoja-excel">
  
  <!-- Encabezado con Logo y Título exacto del Excel -->
  <div class="encabezado-tabla">
    <div class="encabezado-tabla__logo">
     <img src="img/logo3.png" alt="Logo de la empresa">
    </div>
    <div class="encabezado-tabla__titulo">
      CONTROL DE ENTREGA DE ELEMENTOS<br>DE PROTECCIÓN PERSONAL
    </div>
  </div>

  <!-- Sección 1: Datos Fijos del Trabajador -->
  <div class="seccion-trabajador">
    <div class="grid-trabajador">
      <div class="campo-excel">
        <label for="nombre">NOMBRE COMPLETO:</label>
        <input type="text" id="nombre" required placeholder="Nombre y Apellidos">
      </div>
      <div class="campo-excel">
        <label for="documento-id">N° DOCUMENTO DE IDENTIDAD:</label>
        <input type="text" id="documento-id" required placeholder="Número de Cédula">
      </div>
    </div>
    <div class="grid-trabajador" style="margin-top: 10px;">
      <div class="campo-excel">
        <label for="cargo">CARGO:</label>
        <input type="text" id="cargo" placeholder="Ej. TECNICO DE MANTENIMIENTO">
      </div>
    </div>
    <div class="nota-observaciones">
      * En el campo OBSERVACIONES tenga en cuenta las siguientes alternativas: Persona nueva, reposición, cambio de área y/o pérdida.
    </div>
  </div>

  <!-- Sección 2: Registro de la Entrega (Columnas de la tabla) -->
  <div class="seccion-epp">
    <div class="seccion-epp__titulo">DATOS DE LA ENTREGA DE EPP</div>
    
    <div class="campo-excel" style="margin-bottom: 12px;">
      <label for="epp">NOMBRE ELEMENTO ENTREGADO:</label>
      <input type="text" id="epp" required placeholder="Ej. Casco, Guantes, Botas de Seguridad">
    </div>

    <div class="grid-epp">
      <div class="campo-excel">
        <label for="proceso">PROCESO:</label>
        <input type="text" id="proceso" placeholder="Ej. Mantenimiento, Instalación">
      </div>
      <div class="campo-excel">
        <label for="cantidad">CANTIDAD ENTREGADA:</label>
        <input type="number" id="cantidad" value="1" min="1">
      </div>
    </div>

    <div class="grid-epp" style="margin-top: 12px;">
      <div class="campo-excel">
        <label for="observaciones">OBSERVACIONES:</label>
        <select id="observaciones">
          <option value="">-- Seleccionar --</option>
          <option value="Persona nueva">Persona nueva</option>
          <option value="Reposición">Reposición</option>
          <option value="Cambio de área">Cambio de área</option>
          <option value="Pérdida">Pérdida</option>
        </select>
      </div>
      <div class="campo-excel">
        <label for="entrega">ENTREGADO POR:</label>
        <input type="text" id="entrega" required placeholder="Nombre de quien entrega">
      </div>
    </div>

    <!-- Bloque de Firmas -->
    <div class="grid-firmas">
      <div class="firma-bloque">
        <label>FIRMA DE QUIEN RECIBE:</label>
        <div class="firma-lienzo">
          <canvas id="lienzo-recibe"></canvas>
          <span class="firma-lienzo__marca"></span>
          <span class="firma-lienzo__vacio" id="marcador-vacio-recibe">Firme sobre la línea</span>
        </div>
      </div>

      <div class="firma-bloque">
        <label>FIRMA DE QUIEN ENTREGA:</label>
        <div class="firma-lienzo">
          <canvas id="lienzo-entrega"></canvas>
          <span class="firma-lienzo__marca"></span>
          <span class="firma-lienzo__vacio" id="marcador-vacio-entrega">Firme sobre la línea</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Botones -->
  <div class="acciones">
    <button class="boton boton--limpiar" id="btn-limpiar" type="button">Limpiar Firma</button>
    <button class="boton boton--guardar" id="btn-guardar" type="button">Guardar Registro</button>
  </div>

  <p class="estado" id="estado"></p>
</div>

<script>
(function(){
  // Reemplaza esta URL por la URL de tu Web App desplegada en Google Apps Script
  const URL_BACKEND = 'https://script.google.com/macros/s/AKfycbxqRLjOtTGyoAEXpo_VMHSA520v90ElhQCCr-bPc9Dd_TiAfRfPxomr0r7_x62Lj5mO/exec';

  const btnLimpiar = document.getElementById('btn-limpiar');
  const btnGuardar = document.getElementById('btn-guardar');
  const estado = document.getElementById('estado');

  // Campos
  const inputNombre = document.getElementById('nombre');
  const inputDocumento = document.getElementById('documento-id');
  const inputCargo = document.getElementById('cargo');
  const inputEpp = document.getElementById('epp');
  const inputProceso = document.getElementById('proceso');
  const inputCantidad = document.getElementById('cantidad');
  const inputObservaciones = document.getElementById('observaciones');
  const inputEntrega = document.getElementById('entrega');

  // Crea un panel de firma independiente a partir de un canvas y su marcador de "vacío"
  function crearPanelFirma(idCanvas, idMarcador){
    const canvas = document.getElementById(idCanvas);
    const ctx = canvas.getContext('2d');
    const marcadorVacio = document.getElementById(idMarcador);

    let dibujando = false;
    let trazoIniciado = false;
    let ultimaPos = { x: 0, y: 0 };

    function ajustarLienzo(){
      const relacionPixeles = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * relacionPixeles;
      canvas.height = rect.height * relacionPixeles;
      ctx.scale(relacionPixeles, relacionPixeles);
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#000000';
    }

    function posDesdeEvento(evento){
      const rect = canvas.getBoundingClientRect();
      const punto = evento.touches ? evento.touches[0] : evento;
      return {
        x: punto.clientX - rect.left,
        y: punto.clientY - rect.top
      };
    }

    function iniciarTrazo(evento){
      dibujando = true;
      trazoIniciado = true;
      marcadorVacio.style.opacity = '0';
      ultimaPos = posDesdeEvento(evento);
      evento.preventDefault();
    }

    function dibujar(evento){
      if(!dibujando) return;
      const pos = posDesdeEvento(evento);
      ctx.beginPath();
      ctx.moveTo(ultimaPos.x, ultimaPos.y);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
      ultimaPos = pos;
      evento.preventDefault();
    }

    function terminarTrazo(){
      dibujando = false;
    }

    canvas.addEventListener('mousedown', iniciarTrazo);
    canvas.addEventListener('mousemove', dibujar);
    window.addEventListener('mouseup', terminarTrazo);

    canvas.addEventListener('touchstart', iniciarTrazo, { passive: false });
    canvas.addEventListener('touchmove', dibujar, { passive: false });
    canvas.addEventListener('touchend', terminarTrazo);

    window.addEventListener('resize', function(){
      const datosPrevios = trazoIniciado ? canvas.toDataURL() : null;
      ajustarLienzo();
      if(datosPrevios){
        const img = new Image();
        img.onload = function(){ ctx.drawImage(img, 0, 0, canvas.clientWidth, canvas.clientHeight); };
        img.src = datosPrevios;
      }
    });

    ajustarLienzo();

    return {
      estaVacio: function(){ return !trazoIniciado; },
      limpiar: function(){
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        trazoIniciado = false;
        marcadorVacio.style.opacity = '1';
      },
      obtenerDataUrl: function(){ return canvas.toDataURL('image/png'); }
    };
  }

  const firmaRecibe = crearPanelFirma('lienzo-recibe', 'marcador-vacio-recibe');
  const firmaEntrega = crearPanelFirma('lienzo-entrega', 'marcador-vacio-entrega');

  btnLimpiar.addEventListener('click', function(){
    firmaRecibe.limpiar();
    firmaEntrega.limpiar();
    estado.textContent = '';
    estado.className = 'estado';
  });

  btnGuardar.addEventListener('click', function(){
    if(!inputNombre.value.trim() || !inputDocumento.value.trim() || !inputEpp.value.trim() || !inputEntrega.value.trim()){
      estado.textContent = 'Por favor completa los campos obligatorios.';
      estado.className = 'estado estado--error';
      return;
    }
    if(firmaRecibe.estaVacio() || firmaEntrega.estaVacio()){
      estado.textContent = 'Faltan una o ambas firmas.';
      estado.className = 'estado estado--error';
      return;
    }

    const registro = {
      nombre: inputNombre.value.trim(),
      documento: inputDocumento.value.trim(),
      cargo: inputCargo.value.trim(),
      epp: inputEpp.value.trim(),
      proceso: inputProceso.value.trim(),
      cantidad: inputCantidad.value || 1,
      observaciones: inputObservaciones.value,
      entrega: inputEntrega.value.trim(),
      firmaRecibe: firmaRecibe.obtenerDataUrl(),
      firmaEntrega: firmaEntrega.obtenerDataUrl(),
      fecha: new Date().toISOString().split('T')[0]
    };

    btnGuardar.disabled = true;
    estado.textContent = 'Guardando en la hoja de cálculo...';
    estado.className = 'estado';

    fetch(URL_BACKEND, {
      method: 'POST',
      body: JSON.stringify(registro)
    })
      .then(function(respuesta){ return respuesta.json(); })
      .then(function(resultado){
        if(resultado.ok){
          estado.textContent = '¡Registro guardado exitosamente!';
          estado.className = 'estado estado--ok';

          inputNombre.value = '';
          inputDocumento.value = '';
          inputCargo.value = '';
          inputEpp.value = '';
          inputProceso.value = '';
          inputCantidad.value = '1';
          inputObservaciones.value = '';
          inputEntrega.value = '';
          firmaRecibe.limpiar();
          firmaEntrega.limpiar();
        } else {
          estado.textContent = resultado.error || 'No se pudo guardar el registro.';
          estado.className = 'estado estado--error';
        }
      })
      .catch(function(){
        estado.textContent = 'Error de conexión al servidor.';
        estado.className = 'estado estado--error';
      })
      .finally(function(){
        btnGuardar.disabled = false;
      });
  });
})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Control de Entrega de EPP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="barra-superior">
  <img src="img/logo3.png" alt="Logo de la empresa">
  <div class="barra-superior__texto">
    Control de Entrega de EPP
    <span>Elementos de Protección Personal</span>
  </div>
</header>

<main class="contenedor">

  <!-- 1. DATOS DEL TRABAJADOR -->
  <section class="seccion seccion--trabajador">
    <div class="seccion__cabecera">
      <span class="rotulo-seccion">Datos del trabajador</span>
    </div>
    <div class="seccion__cuerpo">
      <div class="campo">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" placeholder="Nombre y apellidos" required>
      </div>
      <div class="campo">
        <label for="documento-id">N° documento de identidad</label>
        <input type="text" id="documento-id" placeholder="Número de cédula" required inputmode="numeric">
      </div>
      <div class="campo">
        <label for="cargo">Cargo</label>
        <input type="text" id="cargo" placeholder="Ej. Técnico de mantenimiento">
      </div>
    </div>
  </section>

  <!-- 2. DATOS DE LA ENTREGA -->
  <section class="seccion">
    <div class="seccion__cabecera">
      <span class="rotulo-seccion">Entrega de EPP</span>
    </div>
    <div class="seccion__cuerpo">
      <div class="campo">
        <label for="epp">Elemento entregado</label>
        <input type="text" id="epp" placeholder="Ej. Casco, guantes, botas de seguridad" required>
      </div>

      <div class="fila-dos">
        <div class="campo">
          <label for="proceso">Proceso</label>
          <select id="proceso">
            <option value="">Seleccionar…</option>
            <option value="Mantenimiento">Mantenimiento</option>
            <option value="Instalación">Instalación</option>
            <option value="Ingeniero">Ingeniero</option>
            <option value="Supervisor">Supervisor</option>
            <option value="Otros">Otros</option>
          </select>
        </div>
        <div class="campo">
          <label for="cantidad">Cantidad</label>
          <div class="stepper">
            <button type="button" id="btn-restar" aria-label="Restar">−</button>
            <input type="number" id="cantidad" value="1" min="1" inputmode="numeric">
            <button type="button" id="btn-sumar" aria-label="Sumar">+</button>
          </div>
        </div>
      </div>

      <div class="campo">
        <label for="observaciones">Observaciones</label>
        <select id="observaciones">
          <option value="">Seleccionar…</option>
          <option value="Persona nueva">Persona nueva</option>
          <option value="Reposición">Reposición</option>
          <option value="Cambio de área">Cambio de área</option>
          <option value="Pérdida">Pérdida</option>
        </select>
      </div>

      <p class="nota">
        En Observaciones ten en cuenta: persona nueva, reposición, cambio de área o pérdida.
      </p>
    </div>
  </section>

  <!-- 3. FIRMAS -->
  <section class="seccion">
    <div class="seccion__cabecera">
      <span class="rotulo-seccion">Firmas</span>
    </div>
    <div class="seccion__cuerpo">

      <div class="firma">
        <div class="firma__cabecera">
          <label>Quien recibe</label>
          <button type="button" class="firma__borrar" id="btn-borrar-recibe">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
            Borrar
          </button>
        </div>
        <div class="firma-lienzo">
          <canvas id="lienzo-recibe"></canvas>
          <span class="firma-lienzo__marca"></span>
          <span class="firma-lienzo__vacio" id="marcador-vacio-recibe">Firme sobre la línea</span>
        </div>
      </div>

      <div class="firma">
        <div class="firma__cabecera">
          <label>Quien entrega</label>
          <button type="button" class="firma__borrar" id="btn-borrar-entrega">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
            Borrar
          </button>
        </div>
        <div class="firma-lienzo">
          <canvas id="lienzo-entrega"></canvas>
          <span class="firma-lienzo__marca"></span>
          <span class="firma-lienzo__vacio" id="marcador-vacio-entrega">Firme sobre la línea</span>
        </div>
      </div>

    </div>
  </section>

  <p class="estado" id="estado"></p>

</main>

<div class="barra-inferior">
  <button type="button" class="boton-guardar" id="btn-guardar">Guardar registro</button>
</div>

<script>
(() => {
  // Misma URL de tu Web App de Apps Script
  const URL_BACKEND = 'https://script.google.com/macros/s/AKfycbwhfkXDxhpd22IqigbEQHSxbVT02cgX8-Wxl1zHgTJp_QKs-QGVvSPgQS0RdGXcLeA1/exec';

  const inputNombre = document.getElementById('nombre');
  const inputDocumento = document.getElementById('documento-id');
  const inputCargo = document.getElementById('cargo');
  const inputEpp = document.getElementById('epp');
  const inputProceso = document.getElementById('proceso');
  const inputCantidad = document.getElementById('cantidad');
  const inputObservaciones = document.getElementById('observaciones');

  const btnGuardar = document.getElementById('btn-guardar');
  const estado = document.getElementById('estado');

  function mostrarEstado(mensaje, tipo){
    estado.textContent = mensaje;
    estado.className = 'estado' + (tipo ? ' estado--' + tipo : '');
  }

  /* ---------------------------------------------------------
     Stepper de cantidad
  --------------------------------------------------------- */
  document.getElementById('btn-sumar').addEventListener('click', () => {
    inputCantidad.value = (parseInt(inputCantidad.value, 10) || 0) + 1;
  });
  document.getElementById('btn-restar').addEventListener('click', () => {
    const actual = parseInt(inputCantidad.value, 10) || 1;
    inputCantidad.value = Math.max(1, actual - 1);
  });

  /* ---------------------------------------------------------
     Panel de firma reutilizable
  --------------------------------------------------------- */
  function crearFirma(idCanvas, idMarcador, idBotonBorrar){
    const canvas = document.getElementById(idCanvas);
    const ctx = canvas.getContext('2d');
    const marcador = document.getElementById(idMarcador);

    let dibujando = false;
    let tieneFirma = false;
    let ultimaPosicion = { x: 0, y: 0 };

    function ajustarCanvas(){
      const relacion = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * relacion;
      canvas.height = rect.height * relacion;
      ctx.scale(relacion, relacion);
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#191C1F';
    }

    function obtenerPosicion(evento){
      const rect = canvas.getBoundingClientRect();
      const punto = evento.touches ? evento.touches[0] : evento;
      return { x: punto.clientX - rect.left, y: punto.clientY - rect.top };
    }

    function comenzar(evento){
      dibujando = true;
      tieneFirma = true;
      marcador.style.opacity = '0';
      ultimaPosicion = obtenerPosicion(evento);
      evento.preventDefault();
    }

    function dibujar(evento){
      if(!dibujando) return;
      const posicion = obtenerPosicion(evento);
      ctx.beginPath();
      ctx.moveTo(ultimaPosicion.x, ultimaPosicion.y);
      ctx.lineTo(posicion.x, posicion.y);
      ctx.stroke();
      ultimaPosicion = posicion;
      evento.preventDefault();
    }

    function terminar(){ dibujando = false; }

    canvas.addEventListener('mousedown', comenzar);
    canvas.addEventListener('mousemove', dibujar);
    window.addEventListener('mouseup', terminar);
    canvas.addEventListener('touchstart', comenzar, { passive: false });
    canvas.addEventListener('touchmove', dibujar, { passive: false });
    canvas.addEventListener('touchend', terminar);

    window.addEventListener('resize', () => {
      const datosPrevios = tieneFirma ? canvas.toDataURL() : null;
      ajustarCanvas();
      if(datosPrevios){
        const img = new Image();
        img.onload = () => ctx.drawImage(img, 0, 0, canvas.clientWidth, canvas.clientHeight);
        img.src = datosPrevios;
      }
    });

    ajustarCanvas();

    function limpiar(){
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      tieneFirma = false;
      marcador.style.opacity = '1';
    }

    document.getElementById(idBotonBorrar).addEventListener('click', limpiar);

    return {
      estaVacio: () => !tieneFirma,
      limpiar,
      obtenerImagen: () => canvas.toDataURL('image/png')
    };
  }

  const firmaRecibe = crearFirma('lienzo-recibe', 'marcador-vacio-recibe', 'btn-borrar-recibe');
  const firmaEntrega = crearFirma('lienzo-entrega', 'marcador-vacio-entrega', 'btn-borrar-entrega');

  /* ---------------------------------------------------------
     Guardar registro
  --------------------------------------------------------- */
  btnGuardar.addEventListener('click', async () => {
    if(!inputNombre.value.trim() || !inputDocumento.value.trim() || !inputEpp.value.trim()){
      mostrarEstado('Por favor completa los campos obligatorios.', 'error');
      return;
    }
    if(firmaRecibe.estaVacio() || firmaEntrega.estaVacio()){
      mostrarEstado('Faltan una o ambas firmas.', 'error');
      return;
    }

    const registro = {
      nombre: inputNombre.value.trim(),
      documento: inputDocumento.value.trim(),
      cargo: inputCargo.value.trim(),
      epp: inputEpp.value.trim(),
      proceso: inputProceso.value.trim(),
      cantidad: inputCantidad.value || 1,
      observaciones: inputObservaciones.value,
      firmaRecibe: firmaRecibe.obtenerImagen(),
      firmaEntrega: firmaEntrega.obtenerImagen(),
      fecha: new Date().toISOString().split('T')[0]
    };

    btnGuardar.disabled = true;
    mostrarEstado('Guardando en la hoja de cálculo…');

    try {
      const respuesta = await fetch(URL_BACKEND, {
        method: 'POST',
        body: JSON.stringify(registro)
      });
      const resultado = await respuesta.json();

      if(resultado.ok){
        mostrarEstado('¡Registro guardado exitosamente!', 'ok');

        inputNombre.value = '';
        inputDocumento.value = '';
        inputCargo.value = '';
        inputEpp.value = '';
        inputProceso.value = '';
        inputCantidad.value = '1';
        inputObservaciones.value = '';
        firmaRecibe.limpiar();
        firmaEntrega.limpiar();
      } else {
        mostrarEstado(resultado.error || 'No se pudo guardar el registro.', 'error');
      }
    } catch (error) {
      console.error('Error:', error);
      mostrarEstado('Error de conexión con el servidor.', 'error');
    } finally {
      btnGuardar.disabled = false;
    }
  });
})();
</script>

</body>
</html>
